<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireNest | Your Career Starts Here</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #101827, #172554);
        color: #ffffff;
        min-height: 100vh;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 8%;
    }

    .logo {
        font-size: 28px;
        font-weight: bold;
        color: #60a5fa;
    }

    nav a {
        color: #ffffff;
        text-decoration: none;
        margin-left: 24px;
    }

    .hero {
        min-height: 75vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 20px;
    }

    .hero h1 {
        font-size: clamp(38px, 6vw, 68px);
        max-width: 850px;
        line-height: 1.15;
        margin-bottom: 24px;
    }

    .hero h1 span {
        color: #60a5fa;
    }

    .hero p {
        max-width: 650px;
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.8;
        margin-bottom: 32px;
    }

    .button {
        display: inline-block;
        padding: 15px 28px;
        background: #3b82f6;
        color: #ffffff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
    }

    .button:hover {
        background: #2563eb;
    }

    .notice {
        margin-top: 24px;
        font-size: 14px;
        color: #cbd5e1;
    }

    footer {
        text-align: center;
        padding: 24px;
        color: #94a3b8;
    }
</style>


</head>
<body>
    <nav>
        <div class="logo">HireNest.</div>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </div>
    </nav>


<main class="hero" id="home">
    <h1>Your Career Starts <span>Here.</span></h1>

    <p id="about">
        Discover career opportunities, connect with companies,
        and explore how your resume matches your dream job with HireNest.
    </p>

    <a class="button" href="#about">Explore HireNest</a>

    <div class="notice">
        Career opportunities. Smarter applications. Better possibilities.
    </div>
</main>

<footer>
    © 2026 HireNest. All rights reserved.
</footer>

</body>
</html>
